baseURL: "https://zzyIyzz.github.io/blog-abt-zzylyzz/"
locale: "zh-cn"
defaultContentLanguage: "zh-cn"
title: "Shaun's blog"
theme: "PaperMod"

languages:
  zh-cn:
    locale: "zh-cn"
    label: "简体中文"
    direction: "ltr"
    weight: 1

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 8

minify:
  disableXML: true
  minifyOutput: true

params:
  env: "production"
  title: "Shaun's blog"
  description: "Shaun's notes on learning, building, and reflection."
  keywords: ["学习", "博客", "复盘", "笔记"]
  author: "Shaun"
  DateFormat: "2006-01-02"
  defaultTheme: "auto"
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: "Shaun's blog"
    Content: "Notes on learning, building, reflection, and what comes next."

menu:
  main:
    - identifier: posts
      name: "文章"
      url: /posts/
      weight: 10
    - identifier: archives
      name: "归档"
      url: /archives/
      weight: 20
    - identifier: search
      name: "搜索"
      url: /search/
      weight: 30
    - identifier: tags
      name: "标签"
      url: /tags/
      weight: 40
    - identifier: about
      name: "关于"
      url: /about/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
