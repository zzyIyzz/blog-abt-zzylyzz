baseURL: "https://zzyIyzz.github.io/blog-abt-zzylyzz/"
locale: "zh-cn"
defaultContentLanguage: "zh-cn"
title: "Jone Chow's Blog"
theme: "PaperMod"

languages:
  zh-cn:
    locale: "zh-cn"
    label: "简体中文"
    direction: "ltr"
    weight: 1

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 20

minify:
  disableXML: true
  minifyOutput: true

params:
  env: "production"
  title: "Jone Chow's Blog"
  description: "Jone Chow's notes on learning, building, and reflection."
  keywords: ["学习", "博客", "复盘", "笔记"]
  author: "Jone Chow"
  DateFormat: "2006-01-02"
  defaultTheme: "light"
  disableThemeToggle: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  ShowToc: false
  TocOpen: false
  disableSpecial1stPost: true

menu:
  main:
    - identifier: posts
      name: "Posts"
      url: /posts/
      weight: 10
    - identifier: archives
      name: "Archive"
      url: /archives/
      weight: 20
    - identifier: search
      name: "Search"
      url: /search/
      weight: 30
    - identifier: about
      name: "About"
      url: /about/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
